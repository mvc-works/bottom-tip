name: npm publish

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "yarn"
          registry-url: https://registry.npmjs.org/

      - name: Use the lockfile's Yarn version
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - run: yarn install --frozen-lockfile && yarn compile && yarn test

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
